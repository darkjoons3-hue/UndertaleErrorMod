name: Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pygame
          pip install pyinstaller
          
      - name: Build EXE
        run: pyinstaller --name UndertaleErrorMode --onefile --windowed --add-data "logo.png;." --add-data "textures.png;." --add-data "history.png;." --add-data "sans-error.png;." --add-data "undertale-dialogs.png;." --add-data "hearts.png;." --add-data "battle-buttons.png;." --add-data "sans-battle.png;." --add-data "determinationmonorusbylyajk.otf;." --add-data "ComicSans.ttf;." --add-data "logo_sound.mp3;." --add-data "logo_sound2.mp3;." --add-data "determination.mp3;." --add-data "undertale-select-sound.mp3;." --add-data "undertale-history.mp3;." --add-data "undertale-bells.mp3;." --add-data "sans-dialogs.mp3;." --add-data "enemy-encounter-undertale.mp3;." --add-data "bone-undertale-sound-effect.mp3;." --add-data "undertale-ding.mp3;." --add-data "gaster_blaster_sound_effect_1.mp3;." --add-data "undertale-damage-taken.mp3;." --add-data "undertale-soul-shatter.mp3;." main.py
        
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UndertaleErrorMode-Windows
          path: dist/UndertaleErrorMode.exe
